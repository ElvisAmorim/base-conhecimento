site_name: Portal do Conhecimento
site_url: https://sitename.example

# tema
theme:
  name: material
  font:
    text: Roboto
    code: Roboto Mono
  # logo
  icon:
    logo: material/library
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro
      primary: brown
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo dark
      primary: brown
      accent: deep purple
  features:
    - content.code.copy


# emojis
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
    # diagramas
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # abas
  - pymdownx.tabbed:
      alternate_style: true
  # advertencia/atencao
  - admonition
  - pymdownx.details


  