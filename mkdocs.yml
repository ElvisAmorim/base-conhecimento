site_name: Portal do Conhecimento
site_url: https://sitename.example

theme:
  name: material
  palette:
    # Dark Mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro
      primary: brown
      accent: deep purple

    # Light Mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Modo dark
      primary: brown
      accent: deep purple

  